<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💫 许愿星愿 - Wishing Star</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at center, #060618 0%, #010108 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    cursor: default;
    user-select: none;
  }

  canvas { position: fixed; top: 0; left: 0; pointer-events: none; }
  #meteorCanvas { z-index: 6; }
  #heartCanvas  { z-index: 3; }
  #burstCanvas  { z-index: 4; }
  #bgCanvas     { z-index: 1; }
  #petalCanvas  { z-index: 2; }

  .ui-layer {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }

  .title {
    font-size: 2.6rem; font-weight: 200;
    color: rgba(255,255,255,.92); letter-spacing: .4em;
    text-shadow: 0 0 30px rgba(180,200,255,.5), 0 0 60px rgba(150,170,255,.3), 0 0 100px rgba(120,150,255,.15);
    animation: titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%,100%{ text-shadow:0 0 30px rgba(180,200,255,.5),0 0 60px rgba(150,170,255,.3); }
    50%    { text-shadow:0 0 50px rgba(200,220,255,.7),0 0 100px rgba(170,190,255,.5),0 0 140px rgba(140,170,255,.25); }
  }

  .card {
    background: rgba(10,10,25,.35);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(180,200,255,.15);
    border-radius: 24px; padding: 38px 44px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: 0 12px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    transition: all .8s cubic-bezier(.4,0,.2,1);
  }
  .card.wished {
    border-color: rgba(160,190,255,.5);
    box-shadow: 0 12px 48px rgba(80,120,255,.2), 0 0 80px rgba(100,140,255,.1), inset 0 1px 0 rgba(255,255,255,.06);
  }

  .input-wrap { position: relative; width: 320px; }
  .wish-input {
    width: 100%; padding: 15px 22px;
    border: 1px solid rgba(180,200,255,.25);
    border-radius: 50px;
    background: rgba(230,240,255,.05);
    color: #dde8ff; font-size: 1.02rem;
    outline: none; transition: all .35s; letter-spacing: .06em;
  }
  .wish-input::placeholder { color: rgba(200,215,255,.28); }
  .wish-input:focus {
    border-color: rgba(140,165,255,.7);
    box-shadow: 0 0 30px rgba(100,140,255,.2), 0 0 60px rgba(100,140,255,.08);
    background: rgba(230,240,255,.08);
  }

  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  .btn {
    padding: 14px 42px; border: none; border-radius: 50px;
    background: linear-gradient(135deg, #6b7fff, #4b5aee);
    color: #fff; font-size: 1.05rem; letter-spacing: .15em;
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform .2s, box-shadow .4s;
    box-shadow: 0 4px 22px rgba(60,80,220,.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(60,80,220,.55); }
  .btn:active { transform: scale(.96); }
  .btn::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,.18), transparent 60%);
    pointer-events: none;
  }

  .btn-ghost {
    background: transparent; border: 1px solid rgba(180,200,255,.3);
    box-shadow: none; color: rgba(200,215,255,.8);
    font-size: .9rem; padding: 12px 28px;
  }
  .btn-ghost:hover { box-shadow: 0 0 24px rgba(150,180,255,.2); background: rgba(255,255,255,.03); }

  .wish-display {
    color: rgba(210,225,255,.9); font-size: 1.15rem;
    letter-spacing: .1em; text-align: center; min-height: 30px;
    opacity: 0; transform: translateY(10px);
    transition: all .7s cubic-bezier(.34,1.56,.64,1);
    max-width: 320px; word-break: break-word;
  }
  .wish-display.show { opacity: 1; transform: translateY(0); }

  .hint { color: rgba(255,255,255,.2); font-size: .75rem; letter-spacing: .12em; margin-top: -6px; }

  .history-overlay {
    position:fixed; inset:0; z-index:100; background: rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .4s;
  }
  .history-overlay.open { opacity:1; pointer-events:auto; }

  .history-panel {
    background: rgba(8,8,22,.92); backdrop-filter: blur(20px);
    border: 1px solid rgba(180,200,255,.2); border-radius: 20px;
    padding: 32px; max-width: 420px; width: 90%; max-height: 60vh;
    display:flex; flex-direction:column; gap:16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .history-panel h3 {
    color:#dde8ff; font-weight:300; letter-spacing:.15em; text-align:center; font-size:1.2rem;
  }
  .history-list {
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:8px;
  }
  .history-list::-webkit-scrollbar { width:4px; }
  .history-list::-webkit-scrollbar-thumb { background:rgba(150,180,255,.3); border-radius:4px; }

  .history-item {
    color:rgba(210,225,255,.8); font-size:.9rem; padding:10px 16px;
    border-radius:12px; background:rgba(255,255,255,.03);
    border:1px solid rgba(180,200,255,.08);
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:translateY(0); } }
  .history-item .time { font-size:.72rem; color:rgba(180,200,255,.35); white-space:nowrap; }

  .btn-close {
    align-self:center; background:rgba(255,255,255,.06);
    border:1px solid rgba(180,200,255,.2); color:#ccc;
    padding:10px 32px; border-radius:50px; cursor:pointer;
    font-size:.9rem; letter-spacing:.1em; transition:all .2s;
  }
  .btn-close:hover { background:rgba(255,255,255,.1); }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="petalCanvas"></canvas>
<canvas id="heartCanvas"></canvas>
<canvas id="burstCanvas"></canvas>
<canvas id="meteorCanvas"></canvas>

<div class="ui-layer">
  <h1 class="title">许 愿 星 愿</h1>
  <div class="card" id="card">
    <div class="input-wrap">
      <input class="wish-input" id="wishInput" type="text" maxlength="60"
             placeholder="把心愿悄悄告诉这颗心…" autocomplete="off" />
    </div>
    <div class="btn-row">
      <button class="btn" id="wishBtn">✨ 许 愿</button>
      <button class="btn btn-ghost" id="historyBtn">📜 心愿瓶</button>
    </div>
    <div class="wish-display" id="wishDisplay"></div>
  </div>
  <p class="hint">流星会带着你的心愿划过天际 🌠</p>
</div>

<div class="history-overlay" id="historyOverlay">
  <div class="history-panel">
    <h3>🫙 心愿瓶</h3>
    <div class="history-list" id="historyList">
      <div style="color:rgba(255,255,255,.2);text-align:center;padding:20px;">还没有许过愿哦</div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn-close" id="btnClearHistory" style="color:#f88;border-color:rgba(255,120,120,.3);display:none;">🗑 清空记录</button>
      <button class="btn-close" id="btnCloseHistory">关 闭</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  工具函数
// ============================================================
const rand = (a,b) => a + Math.random()*(b-a);
const PI2 = Math.PI * 2;

// ============================================================
//  尺寸
// ============================================================
let W, H, cx, cy, sc;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cx = W/2; cy = H/2; sc = Math.min(W,H) / 28;
}
resize();

// ============================================================
//  愿望存储
// ============================================================
const KEY = 'love_wish_history';
let wishes = JSON.parse(localStorage.getItem(KEY) || '[]');
function saveWish(t) {
  wishes.unshift({ text: t, time: Date.now() });
  if (wishes.length > 50) wishes.length = 50;
  localStorage.setItem(KEY, JSON.stringify(wishes));
}
function getWishes() { return wishes; }

// ============================================================
//  Canvas 与 Context
// ============================================================
const bgCvs     = document.getElementById('bgCanvas');
const petalCvs  = document.getElementById('petalCanvas');
const heartCvs  = document.getElementById('heartCanvas');
const burstCvs  = document.getElementById('burstCanvas');
const meteorCvs = document.getElementById('meteorCanvas');

[bgCvs, petalCvs, heartCvs, burstCvs, meteorCvs].forEach(c => { c.width = W; c.height = H; });

const bgCtx     = bgCvs.getContext('2d');
const petalCtx  = petalCvs.getContext('2d');
const heartCtx  = heartCvs.getContext('2d');
const burstCtx  = burstCvs.getContext('2d');
const meteorCtx = meteorCvs.getContext('2d');

const MOUSE = { x: -9999, y: -9999 };

// ============================================================
//  背景星空
// ============================================================
const bgStars = [];
for (let i=0;i<300;i++) {
  bgStars.push({
    x:rand(0,W), y:rand(0,H), r:rand(.4,2),
    ba:rand(.15,.55), s:rand(.004,.03), off:rand(0,PI2),
    hue: rand(200,260),
  });
}
const nebulae = [];
for (let i=0;i<10;i++) {
  nebulae.push({
    x:rand(0,W), y:rand(0,H), r:rand(50,160),
    hue: rand(220,280), a:rand(.01,.04),
  });
}

function drawBg(time) {
  bgCtx.clearRect(0,0,W,H);
  for (const n of nebulae) {
    const g = bgCtx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0, `hsla(${n.hue},60%,45%,${n.a})`);
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(n.x-n.r, n.y-n.r, n.r*2, n.r*2);
  }
  for (const s of bgStars) {
    const a = s.ba * (.5 + .5*Math.sin(time*s.s + s.off));
    bgCtx.beginPath();
    bgCtx.arc(s.x,s.y,s.r,0,PI2);
    bgCtx.fillStyle = `hsla(${s.hue},40%,85%,${a})`;
    bgCtx.fill();
    if (a > .6) {
      bgCtx.strokeStyle = `hsla(${s.hue},30%,80%,${(a-.5)*.5})`;
      bgCtx.lineWidth = .3;
      bgCtx.beginPath();
      bgCtx.moveTo(s.x-s.r*5,s.y); bgCtx.lineTo(s.x+s.r*5,s.y);
      bgCtx.moveTo(s.x,s.y-s.r*5); bgCtx.lineTo(s.x,s.y+s.r*5);
      bgCtx.stroke();
    }
  }
}

// ============================================================
//  花瓣
// ============================================================
const petals = [];
const PETALS = 50;
function mkPetal() {
  return {
    x:rand(0,W), y:-30-rand(0,H*.3), r:rand(2,5.5),
    vx:rand(-.3,.3), vy:rand(.15,.6),
    rot:rand(0,PI2), rv:rand(-.025,.025),
    hue:rand(330,355), a:rand(.25,.45),
    wa:rand(.15,.5), ws:rand(.004,.015), wo:rand(0,PI2),
  };
}
for (let i=0;i<PETALS;i++) { const p=mkPetal(); p.y=rand(0,H); petals.push(p); }

function drawPetals(time) {
  petalCtx.clearRect(0,0,W,H);
  for (const p of petals) {
    p.x += p.vx + Math.sin(time*p.ws + p.wo)*p.wa;
    p.y += p.vy; p.rot += p.rv;
    if (p.y>H+30) Object.assign(p, mkPetal());
    if (p.x<-30) p.x=W+30; if (p.x>W+30) p.x=-30;
    petalCtx.save();
    petalCtx.translate(p.x,p.y);
    petalCtx.rotate(p.rot);
    petalCtx.beginPath();
    petalCtx.ellipse(0,0,p.r,p.r*.5,0,0,PI2);
    petalCtx.fillStyle = `hsla(${p.hue},60%,58%,${p.a})`;
    petalCtx.fill();
    petalCtx.beginPath();
    petalCtx.arc(-p.r*.2,-p.r*.12,p.r*.25,0,PI2);
    petalCtx.fillStyle = `rgba(255,255,255,${p.a*.25})`;
    petalCtx.fill();
    petalCtx.restore();
  }
}

// ============================================================
//  心形粒子
// ============================================================
function hx(t) { return 16*Math.pow(Math.sin(t),3); }
function hy(t) { return 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t); }

class HP {
  constructor(layer) {
    this.layer = layer;
    this.t = rand(0,PI2);
    this.spd = rand(.0015,.012);
    this.sz = layer===0 ? rand(.6,2.2) : rand(.3,.9);
    const hue = rand(335,358);
    this.clr = `hsl(${hue},${rand(70,95)}%,${rand(45,65)}%)`;
    this.alp = layer===0 ? rand(.5,.9) : rand(.2,.4);
    this.ts = rand(.006,.035); this.to = rand(0,PI2);
    this.oo = rand(-.6,.6);
    this.sf = layer===0 ? rand(.86,1) : rand(1.01,1.08);
  }
  update(time) {
    this.t += this.spd; if (this.t>PI2) this.t-=PI2;
    const s = sc * this.sf;
    let tx = cx + hx(this.t)*s + Math.cos(this.t*3+this.oo)*sc*.12;
    let ty = cy - hy(this.t)*s + Math.sin(this.t*3+this.oo)*sc*.12;
    const dx=(this.x||tx)-MOUSE.x, dy=(this.y||ty)-MOUSE.y;
    const dist=Math.sqrt(dx*dx+dy*dy), repelR=110;
    if (dist<repelR&&dist>0) { const f=(repelR-dist)/repelR*5; tx+=dx/dist*f; ty+=dy/dist*f; }
    if (this.x===undefined) { this.x=tx; this.y=ty; }
    this.x+=(tx-this.x)*.07; this.y+=(ty-this.y)*.07;
    this.x+=Math.sin(time*.0018+this.to)*.3;
    this.y+=Math.cos(time*.0018+this.to)*.3;
  }
  draw(ctx, time) {
    const tw = .5+.5*Math.sin(time*this.ts+this.to);
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.sz,0,PI2);
    ctx.fillStyle = this.clr;
    ctx.globalAlpha = this.alp*tw;
    ctx.shadowColor = this.clr;
    ctx.shadowBlur = this.sz*3.5*tw;
    ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

const hps = [];
for (let i=0;i<500;i++) hps.push(new HP(0));
for (let i=0;i<180;i++) hps.push(new HP(1));

// ============================================================
//  爆发粒子 (许愿时)
// ============================================================
let burstP = [], ringP = [];

function burst() {
  const bx=cx, by=cy-sc*3;
  for (let i=0;i<100;i++) {
    const a=rand(0,PI2), spd=rand(1.5,6.5);
    burstP.push({ x:bx,y:by, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-1.2, r:rand(.8,3), life:1, d:rand(.005,.016), hue:rand(330,355) });
  }
  for (let i=0;i<50;i++) {
    ringP.push({ x:bx,y:by, rad:0, maxR:sc*2+rand(0,sc*5), spd:rand(.5,2), a:rand(.5,.9), hue:rand(335,355), life:1 });
  }
  for (let i=0;i<50;i++) {
    burstP.push({ x:bx+rand(-sc,sc)*2.5, y:by+rand(-sc,sc)*1.5, vx:rand(-1,1), vy:-3-rand(0,5), r:rand(.8,2), life:1, d:rand(.004,.012), hue:rand(40,65) });
  }
}

function drawBurst() {
  burstCtx.clearRect(0,0,W,H);
  ringP = ringP.filter(r=>{ r.rad+=r.spd; r.life-=.012; if(r.life<=0)return false;
    burstCtx.beginPath();
    burstCtx.arc(r.x,r.y,r.rad,0,PI2);
    burstCtx.strokeStyle = `hsla(${r.hue},80%,60%,${r.a*r.life})`;
    burstCtx.lineWidth = 1.6*r.life;
    burstCtx.shadowColor = `hsl(${r.hue},80%,60%)`;
    burstCtx.shadowBlur = 10*r.life;
    burstCtx.stroke(); burstCtx.shadowBlur=0;
    return true; });
  burstP = burstP.filter(b=>{ b.life-=b.d; if(b.life<=0)return false;
    b.x+=b.vx; b.y+=b.vy; b.vy+=.012;
    burstCtx.beginPath();
    burstCtx.arc(b.x,b.y,b.r*b.life,0,PI2);
    burstCtx.fillStyle = `hsla(${b.hue},80%,${55+b.life*20}%,${b.life})`;
    burstCtx.shadowColor = `hsl(${b.hue},80%,60%)`;
    burstCtx.shadowBlur = 5*b.life;
    burstCtx.fill(); burstCtx.shadowBlur=0;
    return true; });
}

// ============================================================
//  流星雨引擎 (精致拖尾)
// ============================================================
class Meteor {
  constructor() {
    this.reset();
  }
  reset() {
    // 从屏幕上方或侧上方随机位置出发
    this.alive = true;
    this.x = rand(W*.1, W*.9);
    this.y = rand(-H*.1, H*.25);
    // 角度：斜向下，方向略偏左下或右下
    this.angle = rand(.35, .85) + Math.PI/2; // 大概 110°~150° (右下方向)
    if (Math.random() > .5) this.angle = Math.PI - this.angle + Math.PI; // 镜像到左下
    this.speed = rand(5, 13);
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.tailLen = rand(25, 55);       // 拖尾长度
    this.headR = rand(1.2, 2.8);       // 头部大小
    this.tailWidth = rand(1.8, 4);     // 拖尾宽度
    this.hue = rand(200, 270);         // 蓝-紫-银色调
    if (Math.random() < .25) this.hue = rand(30, 60); // 间或金色
    this.alpha = rand(.7, 1);
    this.history = [];                 // 位置历史
    this.life = 1;
    this.decay = rand(.003, .012);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    // 记录历史位置
    this.history.push({ x: this.x, y: this.y });
    if (this.history.length > this.tailLen) this.history.shift();
    // 出界或消失
    if (this.life <= 0 || this.y > H+60 || this.x < -60 || this.x > W+60) {
      this.alive = false;
    }
  }
  draw(ctx) {
    if (this.history.length < 2) return;
    const pts = this.history;
    const len = pts.length;

    // --- 拖尾：从旧到新逐渐变亮 ---
    for (let i = 0; i < len - 1; i++) {
      const t = i / (len - 1); // 0=尾巴末端, 1=头部附近
      const alpha = t * t * this.alpha * this.life; // 平方衰减更自然
      const w = this.tailWidth * t * .9;
      const px = pts[i].x, py = pts[i].y;
      const nx = pts[i+1].x, ny = pts[i+1].y;

      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(nx, ny);
      ctx.lineWidth = w;
      ctx.strokeStyle = `hsla(${this.hue}, 50%, ${60 + t*30}%, ${alpha})`;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // --- 头部光晕 (多层) ---
    const hx = pts[len-1].x, hy = pts[len-1].y;
    const ha = this.alpha * this.life;

    // 外层大光晕
    const outerGlow = ctx.createRadialGradient(hx, hy, 0, hx, hy, this.headR * 10);
    outerGlow.addColorStop(0, `hsla(${this.hue}, 40%, 85%, ${ha*.5})`);
    outerGlow.addColorStop(.3, `hsla(${this.hue}, 40%, 70%, ${ha*.25})`);
    outerGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(hx, hy, this.headR * 10, 0, PI2);
    ctx.fill();

    // 中层光晕
    const midGlow = ctx.createRadialGradient(hx, hy, 0, hx, hy, this.headR * 3);
    midGlow.addColorStop(0, `hsla(${this.hue}, 20%, 95%, ${ha*.9})`);
    midGlow.addColorStop(.5, `hsla(${this.hue}, 50%, 75%, ${ha*.4})`);
    midGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = midGlow;
    ctx.beginPath();
    ctx.arc(hx, hy, this.headR * 3, 0, PI2);
    ctx.fill();

    // 核心亮点
    const coreGlow = ctx.createRadialGradient(hx, hy, 0, hx, hy, this.headR * 1.5);
    coreGlow.addColorStop(0, `rgba(255,255,255,${ha})`);
    coreGlow.addColorStop(.5, `hsla(${this.hue}, 20%, 90%, ${ha*.7})`);
    coreGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(hx, hy, this.headR * 1.5, 0, PI2);
    ctx.fill();

    // --- 拖尾微粒 (散布在轨迹上的细碎光点) ---
    for (let i = 0; i < len; i += 3) {
      const tp = i / (len - 1);
      const pa = tp * tp * ha * .6;
      if (pa < .02) continue;
      const sx = pts[i].x + rand(-1.5, 1.5);
      const sy = pts[i].y + rand(-1.5, 1.5);
      ctx.beginPath();
      ctx.arc(sx, sy, rand(.15, .7), 0, PI2);
      ctx.fillStyle = `hsla(${this.hue}, 30%, 90%, ${pa})`;
      ctx.fill();
    }
  }
}

// 流星管理器
let meteors = [];
const MAX_METEORS = 4;            // 常驻背景流星上限
let wishMeteorBurst = null;       // 许愿时触发的流星雨 { count, timer, interval }

function spawnMeteor() {
  meteors.push(new Meteor());
}

function triggerMeteorShower() {
  // 许愿时触发密集流星雨
  wishMeteorBurst = { count: 0, max: 18, interval: 80, timer: 0 };
}

function updateMeteors(dt) {
  // 常驻流星
  if (meteors.length < MAX_METEORS && Math.random() < .012) {
    spawnMeteor();
  }

  // 许愿流星雨
  if (wishMeteorBurst) {
    wishMeteorBurst.timer += dt;
    while (wishMeteorBurst.timer >= wishMeteorBurst.interval && wishMeteorBurst.count < wishMeteorBurst.max) {
      wishMeteorBurst.timer -= wishMeteorBurst.interval;
      wishMeteorBurst.count++;
      const m = new Meteor();
      // 让许愿流星更亮更密集
      m.speed = rand(6, 15);
      m.tailLen = rand(35, 70);
      m.headR = rand(1.5, 3.5);
      m.hue = rand(190, 280);
      if (Math.random() < .35) m.hue = rand(35, 60); // 更多金色
      m.alpha = rand(.8, 1);
      m.decay = rand(.006, .018);
      meteors.push(m);
    }
    if (wishMeteorBurst.count >= wishMeteorBurst.max) wishMeteorBurst = null;
  }

  // 更新所有流星
  for (const m of meteors) m.update();
  meteors = meteors.filter(m => m.alive);
}

function drawMeteors() {
  meteorCtx.clearRect(0, 0, W, H);
  for (const m of meteors) m.draw(meteorCtx);
}

// ============================================================
//  主循环
// ============================================================
let lastTime = 0;
const meteorDrawCvs = document.getElementById('meteorCanvas');
const meteorDrawCtx = meteorDrawCvs.getContext('2d');

function loop(ts) {
  const dt = lastTime ? ts - lastTime : 16;
  lastTime = ts;

  drawBg(ts);
  drawPetals(ts);

  heartCtx.clearRect(0, 0, W, H);
  for (const p of hps) { p.update(ts); p.draw(heartCtx, ts); }

  drawBurst();
  updateMeteors(dt);
  drawMeteors();

  requestAnimationFrame(loop);
}

const wishInput   = document.getElementById('wishInput');

// API 配置：部署到 PythonAnywhere 后改成你的地址
const API_BASE = 'https://zhouhuan.pythonanywhere.com';

async function fetchWishes() {
  if (!API_BASE) return [];
  try {
    const res = await fetch(API_BASE + '/api/wishes');
    return await res.json();
  } catch { return []; }
}

async function postWish(text) {
  if (!API_BASE) return false;
  try {
    await fetch(API_BASE + '/api/wishes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    return true;
  } catch { return false; }
}

async function doWish() {
  const text = wishInput.value.trim();
  if (!text) {
    wishInput.focus();
    wishInput.style.animation = 'none';
    wishInput.offsetHeight;
    wishInput.style.animation = 'shake .45s ease';
    return;
  }

  wishDisplay.textContent = '💫 ' + text;
  wishDisplay.classList.add('show');
  card.classList.add('wished');

  saveWish(text);
  postWish(text);  // 同步到服务器（异步不阻塞）

  // 特效序列
  burst();
  triggerMeteorShower();
  setTimeout(burst, 600);
  setTimeout(burst, 1200);

  wishInput.value = '';
  wishInput.blur();

  setTimeout(() => {
    wishDisplay.classList.remove('show');
    card.classList.remove('wished');
  }, 6000);
}

wishBtn.addEventListener('click', doWish);
wishInput.addEventListener('keydown', e => { if (e.key === 'Enter') doWish(); });

// 心愿历史 (优先从服务器加载，本地作为备份)
const historyOverlay = document.getElementById('historyOverlay');
const historyList    = document.getElementById('historyList');
document.getElementById('historyBtn').addEventListener('click', async () => {
  historyList.innerHTML = '<div style="color:rgba(255,255,255,.2);text-align:center;padding:20px;">加载中…</div>';
  historyOverlay.classList.add('open');

  let all = [];
  if (API_BASE) {
    all = await fetchWishes();
  }
  // 如果服务器没数据，用本地备份
  if (all.length === 0) {
    all = getWishes();
  }

  if (all.length === 0) {
    historyList.innerHTML = '<div style="color:rgba(255,255,255,.2);text-align:center;padding:20px;">还没有许过愿哦 🌙</div>';
  } else {
    historyList.innerHTML = all.reverse().map(w => {
      const raw = w.time || w.time;
      let ts = '';
      try {
        const d = new Date(raw);
        if (!isNaN(d.getTime())) {
          ts = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        } else { ts = raw || ''; }
      } catch { ts = raw || ''; }
      const span = document.createElement('span'); span.textContent = w.text;
      return `<div class="history-item"><span>💫 ${span.innerHTML}</span><span class="time">${ts}</span></div>`;
    }).join('');
  }
});
document.getElementById('btnCloseHistory').addEventListener('click', () => historyOverlay.classList.remove('open'));
document.getElementById('btnClearHistory').addEventListener('click', () => {
  if (confirm('确定要清空所有心愿记录吗？此操作不可撤销。')) {
    wishes = [];
    localStorage.removeItem(KEY);
    historyList.innerHTML = '<div style="color:rgba(255,255,255,.2);text-align:center;padding:20px;">还没有许过愿哦 🌙</div>';
  }
});
historyOverlay.addEventListener('click', e => { if (e.target===historyOverlay) historyOverlay.classList.remove('open'); });

//  开发者模式 (隐藏入口 - 空按3次许愿按钮)
// ============================================================
let devMode = false;
let emptyClickCount = 0;
let emptyClickTimer = null;
const btnClearHistory = document.getElementById('btnClearHistory');
const titleEl = document.querySelector('.title');

wishBtn.addEventListener('click', () => {
  if (wishInput.value.trim() !== '') {
    // 有内容 → 正常许愿，重置计数
    emptyClickCount = 0;
    return;
  }
  // 空输入时计数
  emptyClickCount++;
  if (emptyClickTimer) clearTimeout(emptyClickTimer);
  if (emptyClickCount >= 3) {
    emptyClickCount = 0;
    devMode = !devMode;
    btnClearHistory.style.display = devMode ? 'block' : 'none';
    titleEl.style.cursor = devMode ? 'crosshair' : 'default';
    wishDisplay.textContent = devMode ? '🔧 开发者模式已开启' : '🔒 开发者模式已关闭';
    wishDisplay.classList.add('show');
    setTimeout(() => wishDisplay.classList.remove('show'), 2000);
  }
  emptyClickTimer = setTimeout(() => { emptyClickCount = 0; }, 1500);
});

// 启动
requestAnimationFrame(loop);
